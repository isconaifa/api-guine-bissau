openapi: 3.1.0
info:
  title: API Guiné-Bissau
  version: v1
  description: |
    Divisão administrativa da Guiné-Bissau: regiões e Sector Autónomo de Bissau → setores →
    secções. Leitura pública, sem autenticação. Todas as respostas usam o mesmo envelope JSON:

    - **lista**: `{"dados": [...], "total": n, "fonte": "..."}`
    - **objeto**: `{"dados": {...}, "fonte": "..."}`
    - **erro**: `{"erro": {"codigo": "...", "mensagem": "..."}}`

    Cada entidade traz `fonte_id` (detalhes em `/v1/sobre`) e `verificado` (`false` = pendente
    de verificação com a fonte oficial). Os exemplos desta página são respostas reais da API.

    **Slugs das regiões**: `bafata`, `biombo`, `bolama-bijagos`, `cacheu`, `gabu`, `oio`, `quinara`, `tombali`, `sector-autonomo-de-bissau`. O Sector Autónomo de Bissau é
    `sector-autonomo-de-bissau` (não `bissau`).

    **"Try it out"** precisa do servidor a correr (`go run ./cmd/api`). A forma mais simples é abrir
    a documentação servida pelo próprio servidor: <http://localhost:8080/v1/docs/>.

    **Versão estática** (sem servidor e sem pesquisa): acrescente `.json` a cada rota, por
    exemplo <https://isconaifa.github.io/api-guine-bissau/v1/regioes.json>.
  contact:
    name: Francisco Naifa
    url: https://github.com/isconaifa/api-guine-bissau
  license:
    name: MIT
    url: https://github.com/isconaifa/api-guine-bissau/blob/main/LICENSE
servers:
  - url: http://localhost:8080
    description: Servidor local (go run ./cmd/api)
tags:
  - name: Divisão administrativa
  - name: Pesquisa
  - name: Projeto
paths:
  /v1/regioes:
    get:
      tags: [Divisão administrativa]
      summary: Lista as regiões e o Sector Autónomo de Bissau
      operationId: listarRegioes
      responses:
        "200":
          description: As 9 entidades de 1.º nível, na ordem do ficheiro de dados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaRegioes" }
              example: {"dados": [{"slug": "bafata", "nome": "Bafatá", "tipo": "regiao", "capital": "Bafatá", "capital_fonte_id": "wikipedia-pt-subdivisoes", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false}, {"slug": "biombo", "nome": "Biombo", "tipo": "regiao", "capital": "Quinhamel", "capital_fonte_id": "wikipedia-pt-subdivisoes", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false}, {"slug": "bolama-bijagos", "nome": "Bolama Bijagós", "tipo": "regiao", "capital": "Bolama", "capital_fonte_id": "wikipedia-pt-subdivisoes", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false}, {"slug": "cacheu", "nome": "Cacheu", "tipo": "regiao", "capital": "Cacheu", "capital_fonte_id": "wikipedia-pt-subdivisoes", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false}, {"slug": "gabu", "nome": "Gabú", "tipo": "regiao", "capital": "Gabu", "capital_fonte_id": "wikipedia-pt-subdivisoes", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false}, {"slug": "oio", "nome": "Oio", "tipo": "regiao", "capital": "Farim", "capital_fonte_id": "wikipedia-pt-subdivisoes", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false}, {"slug": "quinara", "nome": "Quinara", "tipo": "regiao", "capital": "Buba", "capital_fonte_id": "wikipedia-pt-subdivisoes", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false}, {"slug": "tombali", "nome": "Tombali", "tipo": "regiao", "capital": "Catió", "capital_fonte_id": "wikipedia-pt-subdivisoes", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false}, {"slug": "sector-autonomo-de-bissau", "nome": "Sector Autónomo de Bissau", "tipo": "setor-autonomo", "capital": "Bissau", "capital_fonte_id": "wikipedia-pt-subdivisoes", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false}], "total": 9, "fonte": "INE Guiné-Bissau; Wikipédia (pt)"}
  /v1/regioes/{regiao}:
    get:
      tags: [Divisão administrativa]
      summary: Detalhe de uma região, com a lista dos seus setores
      operationId: detalharRegiao
      parameters: [{ $ref: "#/components/parameters/regiao" }]
      responses:
        "200":
          description: Região encontrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjetoRegiao" }
              example: {"dados": {"slug": "oio", "nome": "Oio", "tipo": "regiao", "capital": "Farim", "capital_fonte_id": "wikipedia-pt-subdivisoes", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false, "setores": [{"slug": "bissora", "nome": "Bissorã"}, {"slug": "farim", "nome": "Farim"}, {"slug": "mansaba", "nome": "Mansaba"}, {"slug": "mansoa", "nome": "Mansoa"}, {"slug": "nhacra", "nome": "Nhacra"}]}, "fonte": "INE Guiné-Bissau; Wikipédia (pt)"}
        "404": { $ref: "#/components/responses/RegiaoNaoEncontrada" }
  /v1/regioes/{regiao}/setores:
    get:
      tags: [Divisão administrativa]
      summary: Lista os setores de uma região
      operationId: listarSetores
      parameters: [{ $ref: "#/components/parameters/regiao" }]
      responses:
        "200":
          description: Setores da região (lista vazia se não houver).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaSetores" }
              example: {"dados": [{"slug": "bissora", "nome": "Bissorã", "fonte_id": "ine-gb-em-numeros-2017", "verificado": true}, {"slug": "farim", "nome": "Farim", "fonte_id": "ine-gb-em-numeros-2017", "verificado": true}, {"slug": "mansaba", "nome": "Mansaba", "fonte_id": "ine-gb-em-numeros-2017", "verificado": true}, {"slug": "mansoa", "nome": "Mansoa", "fonte_id": "ine-gb-em-numeros-2017", "verificado": true}, {"slug": "nhacra", "nome": "Nhacra", "fonte_id": "ine-gb-em-numeros-2017", "verificado": true}], "total": 5, "fonte": "INE Guiné-Bissau"}
        "404": { $ref: "#/components/responses/RegiaoNaoEncontrada" }
  /v1/regioes/{regiao}/setores/{setor}:
    get:
      tags: [Divisão administrativa]
      summary: Detalhe de um setor, com a região a que pertence
      operationId: detalharSetor
      description: O setor só é encontrado dentro da sua região.
      parameters:
        - { $ref: "#/components/parameters/regiao" }
        - { $ref: "#/components/parameters/setor" }
      responses:
        "200":
          description: Setor encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjetoSetor" }
              example: {"dados": {"slug": "bissora", "nome": "Bissorã", "fonte_id": "ine-gb-em-numeros-2017", "verificado": true, "regiao": {"slug": "oio", "nome": "Oio"}, "total_seccoes": 0}, "fonte": "INE Guiné-Bissau"}
        "404": { $ref: "#/components/responses/SetorOuRegiaoNaoEncontrado" }
  /v1/regioes/{regiao}/setores/{setor}/seccoes:
    get:
      tags: [Divisão administrativa]
      summary: Lista as secções de um setor
      operationId: listarSeccoes
      description: |
        Lista vazia quando ainda não há secções publicadas; nesse caso `fonte` é a fonte do
        próprio setor.
      parameters:
        - { $ref: "#/components/parameters/regiao" }
        - { $ref: "#/components/parameters/setor" }
      responses:
        "200":
          description: Secções do setor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaSeccoes" }
              example: {"dados": [], "total": 0, "fonte": "INE Guiné-Bissau"}
        "404": { $ref: "#/components/responses/SetorOuRegiaoNaoEncontrado" }
  /v1/pesquisa:
    get:
      tags: [Pesquisa]
      summary: Pesquisa regiões, setores e secções pelo nome
      operationId: pesquisar
      description: |
        Ignora acentos, maiúsculas e pontuação (`gabu`, `GABÚ` e `Gabú` dão o mesmo resultado).
        Encontra nomes que **contêm** o texto. Ordem: correspondência exata, prefixo, "contém";
        em empate, regiões antes de setores antes de secções; depois por nome.
      parameters:
        - name: q
          in: query
          required: true
          description: Texto a pesquisar (1 a 100 caracteres).
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: gabu
      responses:
        "200":
          description: Resultados (lista vazia se não houver correspondência).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaPesquisa" }
              example: {"dados": [{"tipo": "regiao", "slug": "gabu", "nome": "Gabú", "caminho": "/v1/regioes/gabu", "fonte_id": "ine-gb-em-numeros-2017", "verificado": false}, {"tipo": "setor", "slug": "gabu", "nome": "Gabú", "regiao": {"slug": "gabu", "nome": "Gabú"}, "caminho": "/v1/regioes/gabu/setores/gabu", "fonte_id": "ine-gb-em-numeros-2017", "verificado": true}], "total": 2, "fonte": "INE Guiné-Bissau"}
        "400":
          description: "`PARAMETRO_INVALIDO`: `q` ausente, vazio ou com mais de 100 caracteres."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example: {"erro": {"codigo": "PARAMETRO_INVALIDO", "mensagem": "O parâmetro 'q' é obrigatório e deve ter entre 1 e 100 caracteres."}}
  /v1/sobre:
    get:
      tags: [Projeto]
      summary: Autor, licença, versão e fontes dos dados
      operationId: sobre
      responses:
        "200":
          description: Informações do projeto (envelope sem `fonte` nem `total`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjetoSobre" }
              example: {"dados": {"nome": "API Guiné-Bissau", "autor": "Francisco Naifa", "licenca": "MIT", "versao": "dev", "versao_api": "v1", "repositorio": "https://github.com/isconaifa/api-guine-bissau", "fontes": [{"id": "ine-gb-em-numeros-2017", "nome": "INE Guiné-Bissau", "referencia": "Instituto Nacional de Estatística da Guiné-Bissau, Boletim Estatístico «Guiné-Bissau em Números 2017», Tabela 1 – Divisão administrativa (p. 9); fonte indicada na tabela: Direcção Geral de Cadastro do Ministério das Obras Públicas e Urbanismo. Nomes publicados em maiúsculas no original.", "url": "https://www.stat-guinebissau.com/Menu_principal/Pubica%C3%A7%C3%B5es/anuario/boletim_estatistico_GB/guinebissau-em-numero2017.pdf", "consultado_em": "2026-10-21"}, {"id": "wikipedia-pt-subdivisoes", "nome": "Wikipédia (pt)", "referencia": "Artigo «Subdivisões da Guiné-Bissau», revisão 72530219 — fonte secundária, usada apenas para as capitais regionais até confirmação oficial.", "url": "https://pt.wikipedia.org/w/index.php?title=Subdivis%C3%B5es_da_Guin%C3%A9-Bissau&oldid=72530219", "consultado_em": "2026-10-21"}]}}
  /v1/saude:
    get:
      tags: [Projeto]
      summary: Verificação de saúde (para plataformas de hospedagem)
      operationId: saude
      responses:
        "200":
          description: Serviço ativo (resposta sem cache).
          content:
            application/json:
              schema:
                type: object
                required: [dados]
                properties:
                  dados:
                    type: object
                    required: [estado]
                    properties:
                      estado: { type: string, const: ok }
              example: {"dados": {"estado": "ok"}}
components:
  parameters:
    regiao:
      name: regiao
      in: path
      required: true
      description: "Slug da região: `bafata`, `biombo`, `bolama-bijagos`, `cacheu`, `gabu`, `oio`, `quinara`, `tombali`, `sector-autonomo-de-bissau`."
      schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      example: oio
    setor:
      name: setor
      in: path
      required: true
      description: "Slug do setor (ver `GET /v1/regioes/{regiao}/setores`), por exemplo `bissora` em `oio`."
      schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      example: bissora
  responses:
    RegiaoNaoEncontrada:
      description: "`REGIAO_NAO_ENCONTRADA`: não existe região com o slug pedido."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example: {"erro": {"codigo": "REGIAO_NAO_ENCONTRADA", "mensagem": "Região 'bissau' não encontrada."}}
    SetorOuRegiaoNaoEncontrado:
      description: |
        `REGIAO_NAO_ENCONTRADA` (região inexistente) ou `SETOR_NAO_ENCONTRADO` (setor inexistente
        ou de outra região).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example: {"erro": {"codigo": "SETOR_NAO_ENCONTRADO", "mensagem": "Setor 'bambadinca' não encontrado na região 'oio'."}}
  schemas:
    Referencia:
      type: object
      required: [slug, nome]
      properties:
        slug: { type: string }
        nome: { type: string }
    RegiaoResumo:
      type: object
      required: [slug, nome, tipo, capital, fonte_id, verificado]
      properties:
        slug: { type: string }
        nome: { type: string, description: Nome oficial, com acentos }
        tipo: { type: string, enum: [regiao, setor-autonomo] }
        capital: { type: string }
        capital_fonte_id: { type: string, description: Fonte da capital, quando diferente de fonte_id }
        fonte_id: { type: string, description: Id da fonte (detalhes em /v1/sobre) }
        verificado: { type: boolean, description: false = pendente de verificação }
    RegiaoDetalhe:
      type: object
      required: [slug, nome, tipo, capital, fonte_id, verificado, setores]
      properties:
        slug: { type: string }
        nome: { type: string }
        tipo: { type: string, enum: [regiao, setor-autonomo] }
        capital: { type: string }
        capital_fonte_id: { type: string }
        fonte_id: { type: string }
        verificado: { type: boolean }
        setores:
          type: array
          items: { $ref: "#/components/schemas/Referencia" }
    SetorResumo:
      type: object
      required: [slug, nome, fonte_id, verificado]
      properties:
        slug: { type: string }
        nome: { type: string }
        fonte_id: { type: string }
        verificado: { type: boolean }
    SetorDetalhe:
      type: object
      required: [slug, nome, fonte_id, verificado, regiao, total_seccoes]
      properties:
        slug: { type: string }
        nome: { type: string }
        fonte_id: { type: string }
        verificado: { type: boolean }
        regiao: { $ref: "#/components/schemas/Referencia" }
        total_seccoes: { type: integer, minimum: 0 }
    Seccao:
      type: object
      required: [slug, nome, fonte_id, verificado]
      properties:
        slug: { type: string }
        nome: { type: string }
        fonte_id: { type: string }
        verificado: { type: boolean }
    ResultadoPesquisa:
      type: object
      required: [tipo, slug, nome, caminho, fonte_id, verificado]
      properties:
        tipo: { type: string, enum: [regiao, setor-autonomo, setor, seccao] }
        slug: { type: string }
        nome: { type: string }
        regiao:
          description: Presente em setores e secções
          allOf: [{ $ref: "#/components/schemas/Referencia" }]
        setor:
          description: Presente em secções
          allOf: [{ $ref: "#/components/schemas/Referencia" }]
        caminho: { type: string, description: "Rota da entidade (para secções, a lista de secções do setor)" }
        fonte_id: { type: string }
        verificado: { type: boolean }
    Fonte:
      type: object
      required: [id, nome, referencia, consultado_em]
      properties:
        id: { type: string }
        nome: { type: string }
        referencia: { type: string }
        url: { type: string, format: uri }
        consultado_em: { type: string, format: date }
    Sobre:
      type: object
      required: [nome, autor, licenca, versao, versao_api, repositorio, fontes]
      properties:
        nome: { type: string }
        autor: { type: string }
        licenca: { type: string }
        versao: { type: string }
        versao_api: { type: string }
        repositorio: { type: string, format: uri }
        fontes:
          type: array
          items: { $ref: "#/components/schemas/Fonte" }
    ListaRegioes:
      type: object
      required: [dados, total, fonte]
      properties:
        dados: { type: array, items: { $ref: "#/components/schemas/RegiaoResumo" } }
        total: { type: integer }
        fonte: { type: string, description: Nomes das fontes dos dados devolvidos, separados por "; " }
    ListaSetores:
      type: object
      required: [dados, total, fonte]
      properties:
        dados: { type: array, items: { $ref: "#/components/schemas/SetorResumo" } }
        total: { type: integer }
        fonte: { type: string }
    ListaSeccoes:
      type: object
      required: [dados, total, fonte]
      properties:
        dados: { type: array, items: { $ref: "#/components/schemas/Seccao" } }
        total: { type: integer }
        fonte: { type: string }
    ListaPesquisa:
      type: object
      required: [dados, total, fonte]
      properties:
        dados: { type: array, items: { $ref: "#/components/schemas/ResultadoPesquisa" } }
        total: { type: integer }
        fonte: { type: string, description: Vazio quando não há resultados }
    ObjetoRegiao:
      type: object
      required: [dados, fonte]
      properties:
        dados: { $ref: "#/components/schemas/RegiaoDetalhe" }
        fonte: { type: string }
    ObjetoSetor:
      type: object
      required: [dados, fonte]
      properties:
        dados: { $ref: "#/components/schemas/SetorDetalhe" }
        fonte: { type: string }
    ObjetoSobre:
      type: object
      required: [dados]
      properties:
        dados: { $ref: "#/components/schemas/Sobre" }
    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: object
          required: [codigo, mensagem]
          properties:
            codigo:
              type: string
              enum: [REGIAO_NAO_ENCONTRADA, SETOR_NAO_ENCONTRADO, PARAMETRO_INVALIDO, ROTA_NAO_ENCONTRADA, ERRO_INTERNO]
            mensagem: { type: string, description: Mensagem em português }
