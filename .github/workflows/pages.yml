name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Testes
        run: go test ./...
      - name: Gerar JSON estático
        run: go run ./cmd/gerador -saida publico
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico
      - id: deploy
        uses: actions/deploy-pages@v4
